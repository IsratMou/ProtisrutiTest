{% extends 'base.html' %}

{% block title %}Make a Donation{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4>Support Our Cause</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Donate Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
